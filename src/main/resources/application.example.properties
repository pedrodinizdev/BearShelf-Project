#copiar o exemplo para application.properties e colocar os dados para conectar
spring.application.name=projeto

# Conexao com o PostgreSQL
spring.datasource.url=${DB_URL:jdbc:postgresql://SEU_HOST:5432/postgres}
spring.datasource.username=${DB_USER:SEU_USUARIO}
spring.datasource.password=${DB_PASSWORD:SUA_SENHA}
spring.datasource.driver-class-name=org.postgresql.Driver

# Configuracoes do JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Porta da aplicacao
server.port=8090
